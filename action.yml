name: "ActorMap Gate"
description: "把需求确认成断言，再用断言拦住 PR：需求自洽 + 实现与需求一致 + 契约测试，带行内评论和可一键 Apply 的建议"
author: "eust-w"
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  ir:
    description: "IR 文件路径（相对仓库根目录）"
    required: false
    default: ".actormap/ir.json"
  repo:
    description: "要扫描的实现代码目录；传空字符串则跳过 drift"
    required: false
    default: "."
  adapter:
    description: "契约测试适配器路径（export default { create, act, state }）；留空则跳过 conformance"
    required: false
    default: ""
  strict:
    description: "被跳过的检查也算失败（要求三项都真的跑起来）"
    required: false
    default: "false"
  comment:
    description: "在 PR diff 的新增行上贴行内评论"
    required: false
    default: "true"
  node-version:
    description: "Node 版本（需要 >= 22.18，跑的是 TypeScript 源码）"
    required: false
    default: "22"

outputs:
  result:
    description: "pass 或 fail"
    value: ${{ steps.gate.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: 准备 Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: 跑门禁
      id: gate
      shell: bash
      env:
        ACTORMAP_IR: ${{ inputs.ir }}
        ACTORMAP_REPO: ${{ inputs.repo }}
        ACTORMAP_ADAPTER: ${{ inputs.adapter }}
        ACTORMAP_STRICT: ${{ inputs.strict }}
        ACTORMAP_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        cli="$GITHUB_ACTION_PATH/src/cli.ts"

        args=(gate --ir "$ACTORMAP_IR")
        if [ -n "$ACTORMAP_REPO" ]; then args+=(--repo "$ACTORMAP_REPO"); else args+=(--no-repo); fi
        if [ -n "$ACTORMAP_ADAPTER" ]; then args+=(--adapter "$ACTORMAP_ADAPTER"); fi
        if [ "$ACTORMAP_STRICT" = "true" ]; then args+=(--strict); fi
        if [ "$ACTORMAP_COMMENT" = "true" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          args+=(--github)
        fi

        set +e
        node "$cli" "${args[@]}"
        status=$?
        set -e

        echo "result=$([ "$status" -eq 0 ] && echo pass || echo fail)" >> "$GITHUB_OUTPUT"
        exit "$status"
