name: spec-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 单元测试（零依赖）
        run: npm test

      - name: 门禁 · 正确实现（应通过）
        run: |
          node src/cli.ts gate \
            --ir examples/expense/ir.json \
            --repo examples/expense/service \
            --adapter ./examples/expense/adapters/expense-service.mjs \
            --strict \
            --md-out .gate/pass.md

      - name: 门禁 · 代码偷偷加了需求（应失败）
        run: |
          if node src/cli.ts gate \
            --ir examples/expense/ir.json \
            --repo examples/expense/service-drifted \
            --adapter ./examples/expense/adapters/expense-service.mjs; then
            echo "drift 没抓到偷偷加的迁移 —— 门禁失效"; exit 1
          fi
          echo "按预期拦下了 drift"

      - name: 门禁 · 实现违反契约（应失败）
        run: |
          if node src/cli.ts gate \
            --ir examples/expense/ir.json \
            --repo examples/expense/service \
            --adapter ./examples/expense/adapters/expense-service-broken.mjs; then
            echo "契约测试没抓到 bug —— 门禁失效"; exit 1
          fi
          echo "按预期拦下了契约破坏"

      - name: 行内标注 · 只贴在 diff 里的新增行（不联网预览）
        run: |
          set +e
          node src/cli.ts gate \
            --ir examples/expense/ir.json \
            --repo examples/expense/service-drifted \
            --quiet --dry-run --diff examples/expense/pr.patch > /tmp/review.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then echo "门禁应当失败（退出码 1），实际 $status"; exit 1; fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const p = JSON.parse(readFileSync("/tmp/review.json", "utf8"));
            if (p.comments.length !== 1) throw new Error("应当只有 1 条行内评论，实际 " + p.comments.length);
            if (p.comments[0].start_line !== 56 || p.comments[0].line !== 63) {
              throw new Error("suggestion 范围应当是 56→63，实际 " + p.comments[0].start_line + "→" + p.comments[0].line);
            }
            if (!p.comments[0].body.includes("```suggestion")) throw new Error("缺少 suggestion 块");
            if (!p.comments[0].body.includes("actormap:drift:")) throw new Error("缺少去重标记");
            console.log("行内标注 ok：suggestion 56→63，带去重标记");
          '

      - name: 导出四份投影
        run: node src/cli.ts export --ir examples/expense/ir.json --out /tmp/export

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: dist 不能过期
        run: |
          npm run build
          git diff --exit-code -- dist

      - name: 打包后能在别的项目里跑起来
        run: |
          npm pack --silent
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y > /dev/null
          npm i --silent "$GITHUB_WORKSPACE"/actor-map-*.tgz
          ./node_modules/.bin/actormap --version
          ./node_modules/.bin/actormap validate --ir node_modules/actor-map/examples/expense/ir.json

