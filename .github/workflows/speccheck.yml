name: spec-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 单元测试（零依赖）
        run: npm test

      - name: 门禁 · 正确实现（应通过）
        run: |
          node src/cli.ts gate \
            --ir examples/expense/ir.json \
            --repo examples/expense/service \
            --adapter ./examples/expense/adapters/expense-service.mjs \
            --strict \
            --md-out .gate/pass.md

      - name: 门禁 · 代码偷偷加了需求（应失败）
        run: |
          if node src/cli.ts gate \
            --ir examples/expense/ir.json \
            --repo examples/expense/service-drifted \
            --adapter ./examples/expense/adapters/expense-service.mjs; then
            echo "drift 没抓到偷偷加的迁移 —— 门禁失效"; exit 1
          fi
          echo "按预期拦下了 drift"

      - name: 门禁 · 实现违反契约（应失败）
        run: |
          if node src/cli.ts gate \
            --ir examples/expense/ir.json \
            --repo examples/expense/service \
            --adapter ./examples/expense/adapters/expense-service-broken.mjs; then
            echo "契约测试没抓到 bug —— 门禁失效"; exit 1
          fi
          echo "按预期拦下了契约破坏"

      - name: 行内标注 · 只贴在 diff 里的新增行（不联网预览）
        run: |
          node src/cli.ts gate \
            --ir examples/expense/ir.json \
            --repo examples/expense/service-drifted \
            --quiet --dry-run --diff examples/expense/pr.patch > /tmp/review.json
          node -e '
            const p = require("/tmp/review.json");
            if (p.comments.length !== 1) { console.error("应当只有 1 条行内评论，实际 " + p.comments.length); process.exit(1); }
            if (p.comments[0].line !== 59) { console.error("行号应当是 59"); process.exit(1); }
            if (!p.comments[0].body.includes("actormap:drift:")) { console.error("缺少去重标记"); process.exit(1); }
            console.log("行内标注 ok：line 59，带去重标记");
          '

      - name: 导出四份投影
        run: node src/cli.ts export --ir examples/expense/ir.json --out /tmp/export
