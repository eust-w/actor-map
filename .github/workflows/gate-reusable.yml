name: actormap-gate

# 可复用工作流：想一次挂完整的 job 就用这个；只想加一个 step 就直接用 action。
#
#   jobs:
#     spec-gate:
#       uses: eust-w/actor-map/.github/workflows/gate-reusable.yml@v0.7.0
#       with:
#         ir: .actormap/ir.json
#         repo: .
#         adapter: .actormap/adapter.mjs
#
# 升级：把下面的 @vX.Y.Z 和这里一起改。

on:
  workflow_call:
    inputs:
      ir:
        description: IR 文件路径（相对被检查仓库根目录）
        type: string
        default: .actormap/ir.json
      repo:
        description: 要扫描的实现代码目录；传空字符串则跳过 drift
        type: string
        default: .
      adapter:
        description: 契约测试适配器路径；留空则跳过 conformance
        type: string
        default: ""
      strict:
        description: 被跳过的检查也算失败
        type: boolean
        default: false
      comment:
        description: 是否在 PR diff 上贴行内评论
        type: boolean
        default: true
    outputs:
      result:
        description: pass / fail
        value: ${{ jobs.gate.outputs.result }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      result: ${{ steps.actormap.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: actormap
        uses: eust-w/actor-map@v0.7.0
        with:
          ir: ${{ inputs.ir }}
          repo: ${{ inputs.repo }}
          adapter: ${{ inputs.adapter }}
          strict: ${{ inputs.strict }}
          comment: ${{ inputs.comment }}
